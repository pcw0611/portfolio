<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포트폴리오 관리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="gate" id="gate">
    <form class="gate-card" id="gate-form">
      <h1>포트폴리오 관리</h1>
      <p class="gate-hint">비밀번호를 입력하세요</p>
      <input type="password" id="gate-pw" autocomplete="current-password" autofocus />
      <button type="submit" class="btn btn-primary">입장</button>
      <p class="gate-err" id="gate-err"></p>
    </form>
  </div>

  <div class="admin hidden" id="admin">
    <header class="admin-header">
      <h1>포트폴리오 관리</h1>
      <div class="admin-actions">
        <button type="button" class="btn btn-outline" id="gh-btn">GitHub 연동</button>
        <a class="btn btn-outline" href="index.html" target="_blank" rel="noopener">사이트 보기</a>
        <button type="button" class="btn btn-primary" id="save-btn">저장</button>
      </div>
    </header>

    <section class="card fold">
      <button type="button" class="fold-head" data-fold>
        <h2>프로필</h2>
        <span class="fold-arrow">▾</span>
      </button>
      <div class="fold-body">
        <div class="field-grid">
          <label class="field half"><span>이름</span><input id="pf-name" /></label>
          <label class="field half"><span>한 줄 소개</span><input id="pf-tagline" /></label>
          <label class="field half"><span>이름 (English, 없으면 위 이름 그대로 표시)</span><input id="pf-name-en" /></label>
          <label class="field half"><span>이름 (日本語, 없으면 위 이름 그대로 표시)</span><input id="pf-name-ja" /></label>
          <label class="field half"><span>GitHub 주소 (없으면 비워두세요)</span><input id="pf-github" placeholder="https://github.com/..." /></label>
          <label class="field half"><span>이메일 (없으면 비워두세요)</span><input id="pf-email" /></label>
          <label class="field half"><span>관리 비밀번호</span><input id="pf-password" /></label>
        </div>
      </div>
    </section>

    <section class="card fold">
      <button type="button" class="fold-head" data-fold>
        <h2>태그 프리셋</h2>
        <span class="fold-arrow">▾</span>
      </button>
      <div class="fold-body">
        <p class="hint">프로젝트에 태그를 추가하면 자동으로 여기 등록됩니다. 슬라이더로 숙련도(기술 스택 화면에서 크기·중심 배치에 반영), 색 점으로 색상을 정하고, × 로 프리셋에서 삭제하세요.</p>
        <div id="tag-presets"></div>
      </div>
    </section>
    <datalist id="tag-suggestions"></datalist>
    <div id="tabs-editor-wrap"></div>

    <div class="admin-tab-bar" id="admin-tabs"></div>
    <div id="project-cards"></div>
    <button type="button" class="btn btn-outline add-btn" id="add-project">+ 프로젝트 추가</button>
  </div>

  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
