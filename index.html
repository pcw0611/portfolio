<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css?v=20260819-061" />
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <div class="nav-links">
        <button type="button" class="nav-link active" data-nav="top"></button>
        <button type="button" class="nav-link" data-nav="skills"></button>
      </div>
      <div class="lang-dropdown" id="lang-dropdown">
        <button
          type="button"
          class="lang-select"
          id="lang-btn"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          <span id="lang-btn-label"></span>
          <svg class="lang-chevron" viewBox="0 0 24 24" width="13" height="13">
            <polyline
              points="6 9 12 15 18 9"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <ul class="lang-menu" id="lang-menu" role="listbox">
          <li role="option" data-lang="ko">한국어</li>
          <li role="option" data-lang="en">English</li>
          <li role="option" data-lang="ja">日本語</li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="page">
    <!-- 갤러리(카드 그리드) — 프로젝트가 늘어도 한눈에 훑을 수 있는 기본 화면입니다. -->
    <main class="gallery" id="gallery">
      <header class="gallery-head">
        <div class="gallery-id">
          <h1 class="gallery-name" id="gallery-name"></h1>
          <p class="gallery-tagline" id="gallery-tagline"></p>
        </div>
        <div class="gallery-controls">
          <nav class="gallery-filter" id="gallery-filter"></nav>
          <p class="gallery-count" id="gallery-count"></p>
        </div>
      </header>
      <div class="gallery-sections" id="gallery-sections"></div>
    </main>

    <!-- 상세 — 카드에서 진입하며, 화면 전체 폭을 써서 이미지·PDF가 크게 보입니다. -->
    <section class="detail-view" id="detail-view">
      <button type="button" class="back-btn" id="back-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <polyline
            points="15 18 9 12 15 6"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span id="back-btn-label"></span>
      </button>

      <article class="detail switching" id="detail">
        <span class="project-type-badge" id="detail-type-badge"></span>
        <div class="detail-head">
          <h2 class="detail-title" id="detail-title"></h2>
          <div class="link-btns" id="link-btns"></div>
        </div>
        <div class="tags" id="detail-tags"></div>
        <div class="video-wrap" id="video-wrap"></div>
        <div id="detail-blocks"></div>
        <p class="meta" id="detail-meta"></p>
      </article>

      <nav class="detail-pager" id="detail-pager"></nav>
    </section>

    <section class="skills-section" id="skills">
      <div class="skills-header">
        <h2 class="section-title" id="skills-title"></h2>
        <!--
          마인드맵 보기에 배치 버그가 있어 토글을 잠시 숨기고 블록형으로 고정합니다.
          마인드맵 코드는 그대로 두었으니, 고치면 hidden만 떼면 됩니다.
        -->
        <label class="skills-view-toggle" hidden>
          <input type="checkbox" id="skills-view-checkbox" />
          <span class="skills-view-switch"></span>
          <span id="skills-view-label"></span>
        </label>
      </div>
      <div class="skills-cloud" id="skills-cloud"></div>
      <div class="skills-blocks" id="skills-blocks" style="display: none"></div>
    </section>

    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <!--
    data.js는 관리 페이지 저장 때마다 바뀌는데 이 버전 문자열은 코드 배포 때만 올라갑니다.
    버전을 고정해 두면 저장한 내용이 늦게 반영되므로, data.js는 버전을 붙이지 않고
    Pages의 max-age=600 재검증에 맡깁니다. 코드 파일만 버전으로 캐시를 끊습니다.
  -->
  <script src="data.js"></script>
  <script src="script.js?v=20260819-061"></script>
</body>
</html>
