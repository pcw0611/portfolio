<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>심층  Idle Descent</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <main id="unity-container" aria-label="심층  Idle Descent">
      <canvas id="unity-canvas" width=540 height=960 tabindex="-1"></canvas>
      <div id="unity-loading-bar" role="status" aria-live="polite">
        <div id="unity-loading-title">심층</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </main>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(message, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }

        var item = document.createElement("div");
        item.textContent = message;
        item.className = type === "error" ? "unity-error" : "unity-warning";
        warningBanner.appendChild(item);
        if (type !== "error") {
          setTimeout(function () {
            item.remove();
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Shimcheung Studio",
        productName: "심층  Idle Descent",
        productVersion: "0.5.2.1",
        showBanner: unityShowBanner,
      };

      document.querySelector("#unity-loading-bar").style.display = "flex";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
        }).then(function () {
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
